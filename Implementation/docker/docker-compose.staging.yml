version: '3.8'

services:
  postgres_staging:
    image: postgres:16-alpine
    container_name: jarvis_x_postgres_staging
    restart: always
    environment:
      POSTGRES_USER: jarvis_admin
      POSTGRES_PASSWORD: jarvis_secure_pass_2026
      POSTGRES_DB: jarvis_x_staging_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data

  redis_staging:
    image: redis:7-alpine
    container_name: jarvis_x_redis_staging
    restart: always
    ports:
      - "6380:6379"

volumes:
  postgres_staging_data:
    driver: local
